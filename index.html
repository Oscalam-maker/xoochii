<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Para Xochi 🤍</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;height:-webkit-fill-available;overflow:hidden;background:#010308;font-family:'Cormorant Garamond',serif;}

canvas{position:fixed;top:0;left:0;pointer-events:none;}
#cStars{z-index:1;}
#cAurora{z-index:2;}
#cFlowers{z-index:3;}
#cParticles{z-index:4;}

/* ── TRANSITION OVERLAY ── */
#overlay{position:fixed;inset:0;z-index:50;background:#010308;pointer-events:none;opacity:0;transition:opacity .7s ease;}
#overlay.fade-in{opacity:1;}

/* ── PROGRESS DOTS ── */
#progress{position:fixed;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:10px;opacity:0;transition:opacity .6s ease;}
#progress.visible{opacity:1;}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(140,100,255,.25);transition:all .5s cubic-bezier(.34,1.56,.64,1);}
.dot.active{background:rgba(160,120,255,.9);transform:scale(1.5);box-shadow:0 0 8px rgba(140,100,255,.6);}
.dot.done{background:rgba(100,80,180,.5);}

/* ── SCREENS ── */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;opacity:0;pointer-events:none;padding:24px;padding-bottom:calc(32px + env(safe-area-inset-bottom));padding-top:calc(28px + env(safe-area-inset-top));}
.screen.active{opacity:1;pointer-events:all;}

/* ── S1: PORTADA ── */
.s1-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;}
.s1-eyebrow{font-size:.6rem;letter-spacing:.6em;color:#3a2858;text-transform:uppercase;opacity:0;animation:fadeUp .7s .3s forwards;}
.s1-name{font-family:'Playfair Display',serif;font-size:clamp(4rem,16vw,6.5rem);font-weight:600;font-style:italic;background:linear-gradient(135deg,#b090ff 0%,#70c4ff 40%,#55e898 80%,#a060ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.03em;opacity:0;animation:nameReveal 1.6s .6s cubic-bezier(.16,1,.3,1) forwards;position:relative;}
.s1-name::after{content:'Xochitl';position:absolute;inset:0;background:linear-gradient(135deg,#b090ff,#70c4ff,#55e898);-webkit-background-clip:text;background-clip:text;color:transparent;filter:blur(18px);opacity:0;animation:nameGlow 1.6s .6s forwards;}
@keyframes nameReveal{0%{opacity:0;transform:translateY(28px) scale(.9);}50%{opacity:1;}70%{transform:translateY(-5px) scale(1.03);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes nameGlow{0%{opacity:0;}50%{opacity:.5;}100%{opacity:.2;}}
.s1-divider{display:flex;align-items:center;gap:12px;margin:18px 0;opacity:0;animation:fadeIn .8s 1.8s forwards;}
.s1-divider-line{height:1px;width:55px;background:linear-gradient(90deg,transparent,rgba(140,100,255,.4));}
.s1-divider-line.r{background:linear-gradient(90deg,rgba(80,200,140,.4),transparent);}
.s1-divider-gem{width:5px;height:5px;border-radius:1px;background:linear-gradient(135deg,#a080ff,#50e890);transform:rotate(45deg);}
.s1-sub{font-size:clamp(.82rem,3.5vw,.96rem);font-style:italic;color:#5a4880;letter-spacing:.1em;opacity:0;animation:fadeUp .8s 2.1s forwards;}
.tap-area{margin-top:42px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;opacity:0;animation:fadeUp .8s 2.5s forwards;}
.tap-circle-outer{position:relative;width:70px;height:70px;}
.tap-ring{position:absolute;border-radius:50%;border:1px solid;animation:expandRing 2.2s ease-out infinite;}
.tap-ring-1{inset:0;border-color:rgba(140,100,255,.4);animation-delay:0s;}
.tap-ring-2{inset:-9px;border-color:rgba(80,200,140,.22);animation-delay:.4s;}
.tap-ring-3{inset:-18px;border-color:rgba(80,160,255,.12);animation-delay:.8s;}
@keyframes expandRing{0%{transform:scale(.85);opacity:.8;}100%{transform:scale(1.15);opacity:0;}}
.tap-inner{position:absolute;inset:8px;border-radius:50%;background:linear-gradient(135deg,rgba(100,60,200,.15),rgba(40,140,100,.1));border:1px solid rgba(140,100,255,.3);display:flex;align-items:center;justify-content:center;font-size:1.7rem;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.tap-label{font-size:.58rem;letter-spacing:.35em;color:#2e1e48;text-transform:uppercase;}

/* ── GLASS CARD ── */
.card-outer{max-width:420px;width:94%;display:flex;flex-direction:column;align-items:center;}
.card-label{font-size:.58rem;letter-spacing:.5em;text-transform:uppercase;margin-bottom:14px;opacity:0;transition:opacity .6s .3s,transform .6s .3s;transform:translateY(8px);}
.card-label.show{opacity:1;transform:translateY(0);}
.glass{position:relative;width:100%;border-radius:24px;padding:28px 26px;overflow:hidden;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);}
.glass-bg{position:absolute;inset:0;border-radius:24px;background:rgba(6,3,18,.82);}
.glass-border{position:absolute;inset:0;border-radius:24px;padding:1px;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;}
.glass-shine{position:absolute;top:0;left:0;right:0;height:40%;border-radius:24px 24px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.03) 0%,transparent 100%);pointer-events:none;}
.glass-content{position:relative;z-index:1;}
.card-text{font-size:clamp(.88rem,4vw,1.08rem);line-height:2.05;text-align:center;font-style:italic;}
.card-sep{width:30px;height:1px;margin:16px auto;opacity:.4;}
.card-note{font-size:clamp(.72rem,3vw,.85rem);font-style:italic;text-align:center;opacity:.6;letter-spacing:.06em;}
.card-btn{margin-top:22px;position:relative;background:transparent;border:none;padding:13px 36px;cursor:pointer;font-family:'Cormorant Garamond',serif;font-size:.8rem;letter-spacing:.28em;text-transform:uppercase;touch-action:manipulation;min-height:44px;opacity:0;transition:opacity .6s ease,transform .15s ease;transform:translateY(6px);}
.card-btn.show{opacity:1;transform:translateY(0);}
.card-btn:active{transform:scale(.94);}
.card-btn::before{content:'';position:absolute;inset:0;border-radius:50px;border:1px solid;transition:all .35s ease;}
.card-btn:active::before{background:rgba(255,255,255,.04);}

/* S2 — morado */
#s2 .card-label{color:#7050b0;}
#s2 .glass-border{background:linear-gradient(135deg,rgba(130,80,240,.3),rgba(70,120,220,.15),rgba(50,180,120,.1));}
#s2 .card-text{color:#ccc0f0;}
#s2 .card-sep{background:linear-gradient(90deg,transparent,rgba(120,80,220,.5),transparent);}
#s2 .card-note{color:#8060c0;}
#s2 .card-btn{color:#9070d8;}
#s2 .card-btn::before{border-color:rgba(120,80,200,.28);}

/* S3 — verde */
#s3 .card-label{color:#309858;}
#s3 .glass-border{background:linear-gradient(135deg,rgba(50,180,100,.28),rgba(40,140,80,.14),rgba(80,100,200,.08));}
#s3 .card-text{color:#b0eece;}
#s3 .card-sep{background:linear-gradient(90deg,transparent,rgba(50,190,110,.5),transparent);}
#s3 .card-note{color:#409060;}
#s3 .card-btn{color:#40b068;}
#s3 .card-btn::before{border-color:rgba(50,180,100,.28);}

/* S4 — final */
.s4-title{font-family:'Playfair Display',serif;font-size:clamp(1.45rem,6.5vw,2.1rem);font-style:italic;color:#fff;text-align:center;margin-bottom:22px;letter-spacing:.04em;opacity:0;transition:opacity .9s .2s,transform .9s .2s;transform:translateY(12px);text-shadow:0 0 50px rgba(120,80,220,.35),0 0 100px rgba(60,160,100,.15);}
.s4-title.show{opacity:1;transform:translateY(0);}
#s4 .glass-border{background:linear-gradient(135deg,rgba(120,70,230,.3),rgba(60,150,255,.15),rgba(45,180,110,.18));}
#s4 .card-text{color:#ddd0f8;}
#s4 .card-sep{background:linear-gradient(90deg,transparent,rgba(120,80,220,.4),rgba(50,190,110,.3),transparent);}
#s4 .card-note{color:#5a4090;}
.s4-sign{margin-top:18px;font-size:clamp(.68rem,2.8vw,.8rem);letter-spacing:.22em;color:#2a1848;text-align:center;text-transform:uppercase;opacity:0;transition:opacity 1s 1.5s ease;}
.s4-sign.show{opacity:1;}

/* ── MUSIC ── */
.music-btn{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));right:18px;z-index:80;background:rgba(6,3,18,.9);border:1px solid rgba(110,70,210,.25);border-radius:50px;padding:10px 20px;color:#8060c0;font-family:'Cormorant Garamond',serif;font-size:.78rem;cursor:pointer;display:flex;align-items:center;gap:7px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);touch-action:manipulation;min-height:44px;letter-spacing:.1em;opacity:0;transition:opacity .6s ease,border-color .3s,color .3s;transform:translateY(4px);}
.music-btn.show{opacity:1;transform:translateY(0);}
.music-btn:active{transform:scale(.94);}
.music-btn.playing .micon{animation:spinIcon 4s linear infinite;}
@keyframes spinIcon{to{transform:rotate(360deg);}}
.mbar{position:fixed;bottom:0;left:0;right:0;height:2px;z-index:80;background:rgba(60,20,120,.2);}
.mfill{height:100%;width:0%;background:linear-gradient(90deg,#2a1060,#8040e0,#3cb870);transition:width .7s linear;}

/* ── TOUCH FX ── */
.touch-ring{position:fixed;pointer-events:none;z-index:200;border-radius:50%;border:1.5px solid;animation:touchExpand .6s cubic-bezier(.2,0,.8,1) forwards;}
@keyframes touchExpand{0%{transform:scale(0);opacity:.9;}100%{transform:scale(1);opacity:0;}}
.touch-emoji{position:fixed;pointer-events:none;z-index:200;font-size:.95rem;animation:emojiFloat 1s cubic-bezier(.2,0,.4,1) forwards;}
@keyframes emojiFloat{0%{opacity:1;transform:translateY(0) scale(1) rotate(-10deg);}100%{opacity:0;transform:translateY(-55px) scale(.6) rotate(15deg);}}

/* ── PETAL RAIN ── */
.petal{position:fixed;pointer-events:none;z-index:6;opacity:0;animation:petalFall linear forwards;}
@keyframes petalFall{0%{opacity:0;transform:translateY(-10px) rotate(0deg) scale(1);}6%{opacity:.85;}88%{opacity:.4;}100%{opacity:0;transform:translateY(108vh) rotate(500deg) scale(.7);}}

/* ── KEYFRAMES ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
</style>
</head>
<body>

<audio id="music" loop playsinline webkit-playsinline>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div id="overlay"></div>
<div id="progress"></div>

<canvas id="cStars"></canvas>
<canvas id="cAurora"></canvas>
<canvas id="cFlowers"></canvas>
<canvas id="cParticles"></canvas>

<!-- S1: PORTADA -->
<div class="screen active" id="s1">
  <div class="s1-wrap">
    <div class="s1-eyebrow">esto es para ti</div>
    <div class="s1-name">Xochitl</div>
    <div class="s1-divider">
      <div class="s1-divider-line"></div>
      <div class="s1-divider-gem"></div>
      <div class="s1-divider-line r"></div>
    </div>
    <div class="s1-sub">algo especial, desde el corazón</div>
    <div class="tap-area" onclick="goTo(2)">
      <div class="tap-circle-outer">
        <div class="tap-ring tap-ring-3"></div>
        <div class="tap-ring tap-ring-2"></div>
        <div class="tap-ring tap-ring-1"></div>
        <div class="tap-inner">🤍</div>
      </div>
      <div class="tap-label">toca para abrir</div>
    </div>
  </div>
</div>

<!-- S2: EL MOMENTO DIFÍCIL -->
<div class="screen" id="s2">
  <div class="card-outer">
    <div class="card-label" id="lbl2">lo que estás viviendo</div>
    <div class="glass">
      <div class="glass-bg"></div>
      <div class="glass-border"></div>
      <div class="glass-shine"></div>
      <div class="glass-content">
        <p class="card-text" id="txt2"></p>
      </div>
    </div>
    <button class="card-btn" id="btn2" onclick="goTo(3)">seguir &rarr;</button>
  </div>
</div>

<!-- S3: EL LUNES -->
<div class="screen" id="s3">
  <div class="card-outer">
    <div class="card-label" id="lbl3">🌿 &nbsp;nuevo comienzo</div>
    <div class="glass">
      <div class="glass-bg"></div>
      <div class="glass-border"></div>
      <div class="glass-shine"></div>
      <div class="glass-content">
        <p class="card-text" id="txt3"></p>
      </div>
    </div>
    <button class="card-btn" id="btn3" onclick="goTo(4)">seguir &rarr;</button>
  </div>
</div>

<!-- S4: FINAL -->
<div class="screen" id="s4">
  <div class="card-outer">
    <div class="s4-title" id="s4title">siempre aquí, Xochi</div>
    <div class="glass">
      <div class="glass-bg"></div>
      <div class="glass-border"></div>
      <div class="glass-shine"></div>
      <div class="glass-content">
        <p class="card-text" id="txt4"></p>
        <div class="card-sep"></div>
        <p class="card-note">Eso no cambia, no importa el tiempo<br>ni la distancia.</p>
      </div>
    </div>
    <div class="s4-sign" id="s4sign">— siempre, para lo que necesites &nbsp;🤍</div>
  </div>
</div>

<button class="music-btn" id="mbtn" onclick="toggleMusic()">
  <span class="micon">🎵</span>
  <span id="mlbl">Música</span>
</button>
<div class="mbar"><div class="mfill" id="mfill"></div></div>

<script>
// ── AUDIO ──────────────────────────────────────────────────────────
const audio  = document.getElementById('music');
const mbtn   = document.getElementById('mbtn');
const mlbl   = document.getElementById('mlbl');
const mfill  = document.getElementById('mfill');
let playing  = false;
function toggleMusic(){
  if(!playing){
    audio.play().then(()=>{ playing=true; mbtn.classList.add('playing'); mlbl.textContent='Pausar'; }).catch(()=>{});
  } else {
    audio.pause(); playing=false; mbtn.classList.remove('playing'); mlbl.textContent='Música';
  }
}
audio.addEventListener('timeupdate',()=>{ if(audio.duration) mfill.style.width=(audio.currentTime/audio.duration*100)+'%'; });

// ── PROGRESS ───────────────────────────────────────────────────────
const TOTAL = 4;
const progEl = document.getElementById('progress');
for(let i=1;i<=TOTAL;i++){
  const d=document.createElement('div');
  d.className='dot'+(i===1?' active':'');
  d.id='dot'+i;
  progEl.appendChild(d);
}
function updateDots(n){
  for(let i=1;i<=TOTAL;i++){
    const d=document.getElementById('dot'+i);
    d.className='dot'+(i===n?' active':i<n?' done':'');
  }
}

// ── MESSAGES ───────────────────────────────────────────────────────
const MSGS = {
  2:`Sé que ahorita las cosas no las estas pasando bien pequeña\nen cuanto algunos aspectos en la escuela\n\ny eso duele, a veces más de lo que parece.\n\nPero quiero que sepas que no estás sola.\nYo estoy aquí para escucharte,\npara lo que sea que necesites.`,
  3:`El lunes empieza algo nuevo\ny quiero que llegues sabiendo\nque tienes a alguien en tu esquina.\n\nNo importa cómo vaya el día,\naquí hay alguien que cree en ti\ny que te desea lo mejor de verdad.`,
  4:`Desde la prepa supiste ser\nalguien muy importante para mí.\n\nY aunque el tiempo hizo sus cosas…\nlo que construimos no se fue a ningún lado.\n\nEstarás bien, Xochi.\nY cuando no lo estés,\naquí estaré para escucharte.`
};

// ── TYPEWRITER ─────────────────────────────────────────────────────
function typeText(id, msg, onDone){
  const el=document.getElementById(id);
  el.innerHTML=''; let i=0;
  function tick(){
    if(i<msg.length){
      el.innerHTML += msg[i]==='\n'?'<br>':msg[i];
      i++;
      setTimeout(tick, msg[i-1]==='\n'?320:33);
    } else { if(onDone) onDone(); }
  }
  tick();
}

// ── SCREEN TRANSITIONS ─────────────────────────────────────────────
let cur=1;
const overlay=document.getElementById('overlay');

function goTo(n){
  // fade out via overlay
  overlay.classList.add('fade-in');
  setTimeout(()=>{
    document.getElementById('s'+cur).style.opacity='0';
    document.getElementById('s'+cur).style.pointerEvents='none';
    cur=n;
    const next=document.getElementById('s'+n);
    next.style.opacity='0';
    next.style.pointerEvents='all';

    setTimeout(()=>{
      overlay.classList.remove('fade-in');
      next.style.transition='opacity 1.1s cubic-bezier(.4,0,.2,1)';
      next.style.opacity='1';
      updateDots(n);
      if(n===2){ activateCard(2); }
      if(n===3){ activateCard(3); }
      if(n===4){ activateFinal(); }
    },200);
  },500);
}

function activateCard(n){
  const lbl=document.getElementById('lbl'+n);
  const btn=document.getElementById('btn'+n);
  setTimeout(()=>{ lbl.classList.add('show'); },300);
  setTimeout(()=>{
    typeText('txt'+n, MSGS[n], ()=>{
      setTimeout(()=>{ btn.classList.add('show'); },300);
    });
  },600);
}

function activateFinal(){
  mbtn.classList.add('show');
  setTimeout(()=>{ document.getElementById('s4title').classList.add('show'); },400);
  setTimeout(()=>{
    typeText('txt4', MSGS[4], ()=>{
      setTimeout(()=>{ document.getElementById('s4sign').classList.add('show'); },400);
    });
  },900);
}

// init progress visible after s1 loads
setTimeout(()=>{ progEl.classList.add('visible'); },2200);

// ── TOUCH FX ───────────────────────────────────────────────────────
const TOUCH_COLORS=['rgba(140,90,255,.6)','rgba(60,180,255,.6)','rgba(50,210,120,.6)','rgba(180,100,255,.5)'];
const TOUCH_EMOJIS=['💜','💙','🌿','✨','🌸','⭐','🫧','🤍'];

document.addEventListener('click',e=>{
  if(e.target.closest('button')||e.target.closest('.tap-area')||e.target.closest('.music-btn')) return;
  const sz=50+Math.random()*50;
  const ring=document.createElement('div');
  ring.className='touch-ring';
  ring.style.cssText=`left:${e.clientX-sz/2}px;top:${e.clientY-sz/2}px;width:${sz}px;height:${sz}px;border-color:${TOUCH_COLORS[Math.floor(Math.random()*TOUCH_COLORS.length)]};`;
  document.body.appendChild(ring);
  setTimeout(()=>ring.remove(),700);

  const em=document.createElement('div');
  em.className='touch-emoji';
  em.innerText=TOUCH_EMOJIS[Math.floor(Math.random()*TOUCH_EMOJIS.length)];
  em.style.left=(e.clientX-10)+'px';
  em.style.top=(e.clientY-10)+'px';
  document.body.appendChild(em);
  setTimeout(()=>em.remove(),1100);
});

// ── PETAL RAIN ─────────────────────────────────────────────────────
const PETALS=['💜','💙','🌿','🌸','⭐','🫧','✨'];
function spawnPetal(){
  const p=document.createElement('div');
  p.className='petal';
  p.innerText=PETALS[Math.floor(Math.random()*PETALS.length)];
  const dur=6+Math.random()*7;
  const delay=Math.random()*1.5;
  p.style.cssText=`left:${Math.random()*100}vw;top:-20px;font-size:${.65+Math.random()*.55}rem;animation-duration:${dur}s;animation-delay:${delay}s;`;
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),(dur+delay+.5)*1000);
}
setInterval(spawnPetal,620);

// ── CANVAS INIT ────────────────────────────────────────────────────
const W=()=>window.innerWidth, H=()=>window.innerHeight;
function initCanvas(id){ const c=document.getElementById(id); c.width=W(); c.height=H(); return c; }

// ── STARS ──────────────────────────────────────────────────────────
const cStars=initCanvas('cStars'); const sCtx=cStars.getContext('2d');
const STAR_COLS=[[160,120,255],[100,170,255],[80,220,155],[255,248,230],[200,160,255],[130,210,255],[180,140,255]];
const stars=Array.from({length:260},()=>{
  const c=STAR_COLS[Math.floor(Math.random()*STAR_COLS.length)];
  return { x:Math.random()*W(), y:Math.random()*H()*.82, r:Math.random()*1.7+.18, speed:Math.random()*.007+.002, phase:Math.random()*Math.PI*2, c, big:Math.random()<.06 };
});

// shooting stars pool
const shoots=Array.from({length:4},()=>({active:false,x:0,y:0,vx:0,vy:0,life:0,max:0,trail:[]}));
function fireShoot(){
  const s=shoots.find(s=>!s.active); if(!s) return;
  s.active=true; s.trail=[];
  s.x=Math.random()*W()*.65; s.y=Math.random()*H()*.28;
  const ang=Math.PI*.18+Math.random()*.22, spd=7+Math.random()*5;
  s.vx=Math.cos(ang)*spd; s.vy=Math.sin(ang)*spd;
  s.life=0; s.max=55+Math.floor(Math.random()*35);
}
setInterval(fireShoot, 3500+Math.random()*2500);

function drawStars(t){
  sCtx.clearRect(0,0,cStars.width,cStars.height);
  stars.forEach(s=>{
    const a=.12+.88*Math.abs(Math.sin(s.phase+t*s.speed));
    const [r,g,b]=s.c;
    sCtx.beginPath(); sCtx.arc(s.x,s.y,s.r,0,Math.PI*2);
    sCtx.fillStyle=`rgba(${r},${g},${b},${a})`; sCtx.fill();
    if(s.big && a>.65){
      // cross sparkle
      const cr=s.r*3.5*a;
      sCtx.save();
      sCtx.strokeStyle=`rgba(${r},${g},${b},${a*.25})`;
      sCtx.lineWidth=.5;
      sCtx.beginPath(); sCtx.moveTo(s.x-cr,s.y); sCtx.lineTo(s.x+cr,s.y); sCtx.stroke();
      sCtx.beginPath(); sCtx.moveTo(s.x,s.y-cr); sCtx.lineTo(s.x,s.y+cr); sCtx.stroke();
      sCtx.restore();
      sCtx.beginPath(); sCtx.arc(s.x,s.y,s.r*3,0,Math.PI*2);
      sCtx.fillStyle=`rgba(${r},${g},${b},${a*.06})`; sCtx.fill();
    }
  });
  // shooting stars
  shoots.forEach(s=>{
    if(!s.active) return;
    s.trail.push({x:s.x,y:s.y}); if(s.trail.length>22) s.trail.shift();
    s.x+=s.vx; s.y+=s.vy; s.life++;
    if(s.life>=s.max||s.x>W()||s.y>H()){ s.active=false; return; }
    const fade=1-s.life/s.max;
    for(let i=1;i<s.trail.length;i++){
      const p=i/s.trail.length;
      sCtx.beginPath(); sCtx.moveTo(s.trail[i-1].x,s.trail[i-1].y); sCtx.lineTo(s.trail[i].x,s.trail[i].y);
      sCtx.strokeStyle=`rgba(200,170,255,${p*.75*fade})`; sCtx.lineWidth=p*2; sCtx.stroke();
    }
    sCtx.beginPath(); sCtx.arc(s.x,s.y,2,0,Math.PI*2);
    sCtx.fillStyle=`rgba(230,215,255,${fade*.9})`; sCtx.fill();
    sCtx.beginPath(); sCtx.arc(s.x,s.y,5,0,Math.PI*2);
    sCtx.fillStyle=`rgba(180,150,255,${fade*.15})`; sCtx.fill();
  });
}

// ── AURORA ─────────────────────────────────────────────────────────
const cAurora=initCanvas('cAurora'); const aCtx=cAurora.getContext('2d');
const AURORA=[
  {cx:.38,cy:.12,rx:.62,ry:.28,c1:[60,20,160],c2:[100,50,220],sp:.00022,ph:0},
  {cx:.68,cy:.1,rx:.55,ry:.22,c1:[20,80,160],c2:[40,180,140],sp:.00018,ph:2.1},
  {cx:.5,cy:.18,rx:.78,ry:.2,c1:[80,20,140],c2:[50,120,200],sp:.00028,ph:4.2},
  {cx:.25,cy:.08,rx:.4,ry:.18,c1:[100,30,180],c2:[60,80,220],sp:.00015,ph:1.4},
];
function drawAurora(t){
  aCtx.clearRect(0,0,cAurora.width,cAurora.height);
  const AW=cAurora.width, AH=cAurora.height;
  AURORA.forEach(l=>{
    const pulse=.5+.5*Math.sin(t*l.sp*3+l.ph);
    const ox=Math.sin(t*l.sp+l.ph)*30, oy=Math.cos(t*l.sp*.6+l.ph)*12;
    const cx=AW*l.cx+ox, cy=AH*l.cy+oy;
    const rx=AW*l.rx, ry=AH*l.ry;
    aCtx.save();
    aCtx.translate(cx,cy); aCtx.scale(1,ry/rx);
    const grd=aCtx.createRadialGradient(0,0,0,0,0,rx);
    const [r1,g1,b1]=l.c1, [r2,g2,b2]=l.c2;
    grd.addColorStop(0,`rgba(${r1},${g1},${b1},${.055+pulse*.028})`);
    grd.addColorStop(.45,`rgba(${r2},${g2},${b2},${.028+pulse*.014})`);
    grd.addColorStop(1,'rgba(0,0,0,0)');
    aCtx.beginPath(); aCtx.arc(0,0,rx,0,Math.PI*2);
    aCtx.fillStyle=grd; aCtx.fill();
    aCtx.restore();
  });
}

// ── LIRIOS (IRIS / LILY) ───────────────────────────────────────────
const cFlowers=initCanvas('cFlowers'); const fCtx=cFlowers.getContext('2d');

const PALETTES=[
  {p:'#7535d8',p2:'#b080ff',stem:'#1e0e50',leaf:'#183828',lf2:'#102418'},
  {p:'#4428b0',p2:'#8860f0',stem:'#140a3a',leaf:'#122018',lf2:'#0c1810'},
  {p:'#2858d0',p2:'#70a8ff',stem:'#0c1840',leaf:'#0e2016',lf2:'#081410'},
  {p:'#1850b8',p2:'#5090e8',stem:'#081430',leaf:'#0c1e14',lf2:'#080e0c'},
  {p:'#208850',p2:'#60d888',stem:'#082814',leaf:'#081808',lf2:'#060e06'},
  {p:'#158848',p2:'#50c870',stem:'#061e10',leaf:'#060e06',lf2:'#040804'},
  {p:'#5525c0',p2:'#a070f0',stem:'#180840',leaf:'#101e18',lf2:'#0a1010'},
];

function buildFlowers(){
  const FW=cFlowers.width;
  const n=Math.max(7,Math.floor(FW/65));
  return Array.from({length:n},(_,i)=>{
    const pal=PALETTES[Math.floor(Math.random()*PALETTES.length)];
    return {
      x:(i/(n-1))*FW*.86+FW*.07,
      stemH:0, maxH:58+Math.random()*90,
      delay:i*75+Math.random()*130,
      born:Date.now(),
      sway:Math.random()*Math.PI*2,
      swayS:.2+Math.random()*.3,
      scale:.52+Math.random()*.58,
      pal,
      hasBud:Math.random()<.4,
      budSide:Math.random()>.5?1:-1,
      budAngle:.22+Math.random()*.18,
      leafOffset:Math.random()*Math.PI*.5
    };
  });
}
let flowers=buildFlowers();

function lilyLeaf(ctx,x,y,size,dir,col1,col2){
  ctx.save(); ctx.translate(x,y); ctx.scale(dir,1);
  const g=ctx.createLinearGradient(0,0,size*2.2,0);
  g.addColorStop(0,col1); g.addColorStop(.7,col2||col1+'99'); g.addColorStop(1,col1+'44');
  ctx.fillStyle=g; ctx.globalAlpha=.82;
  ctx.beginPath(); ctx.moveTo(0,0);
  ctx.bezierCurveTo(size*.5,-size*.32,size*1.6,-size*.1,size*2.2,size*.08);
  ctx.bezierCurveTo(size*1.5,size*.38,size*.4,size*.2,0,0);
  ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.lineWidth=.55;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(size*1.1,-size*.1,size*2.1,size*.06); ctx.stroke();
  ctx.restore();
}

function lilyBud(ctx,x,y,prog,pal,sc){
  if(prog<=0) return;
  const r=prog*9*sc;
  ctx.save(); ctx.translate(x,y);
  // sepals
  ctx.fillStyle=pal.leaf; ctx.globalAlpha=prog*.9;
  for(let i=0;i<3;i++){
    const a=(i/3)*Math.PI*2-Math.PI/2;
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.bezierCurveTo(Math.cos(a+.5)*r*.5,Math.sin(a+.5)*r*.5,Math.cos(a)*r*1.1,Math.sin(a)*r*1.1,Math.cos(a-.4)*r*.5,Math.sin(a-.4)*r*.5);
    ctx.fill();
  }
  // petals
  ctx.fillStyle=pal.p; ctx.globalAlpha=prog*.85;
  ctx.beginPath(); ctx.ellipse(0,-r*.85,r*.3,r,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function lilyBloom(ctx,x,y,prog,pal,sc,t){
  const r=prog*19*sc;
  // outer 3 falls (drooping petals)
  for(let i=0;i<3;i++){
    const ang=(i/3)*Math.PI*2-Math.PI/2;
    const ox=Math.cos(ang)*r*.18*prog, oy=Math.sin(ang)*r*.18*prog;
    ctx.save(); ctx.translate(x+ox,y+oy); ctx.rotate(ang+Math.PI);
    const pg=ctx.createLinearGradient(0,0,0,r*.9);
    pg.addColorStop(0,pal.p2+'cc'); pg.addColorStop(.5,pal.p+'ee'); pg.addColorStop(1,pal.p+'88');
    ctx.fillStyle=pg; ctx.globalAlpha=.8*prog;
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.bezierCurveTo(-r*.24,r*.25,-r*.28,r*.65,0,r*.95);
    ctx.bezierCurveTo(r*.28,r*.65,r*.24,r*.25,0,0);
    ctx.fill();
    // veins
    ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=.65; ctx.globalAlpha=prog*.7;
    ctx.beginPath(); ctx.moveTo(0,4); ctx.quadraticCurveTo(r*.08,r*.5,0,r*.88); ctx.stroke();
    ctx.restore();
  }
  // inner 3 standards (upright petals)
  for(let i=0;i<3;i++){
    const ang=(i/3)*Math.PI*2+Math.PI/6;
    ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
    const pg2=ctx.createLinearGradient(0,0,0,-r*.9);
    pg2.addColorStop(0,pal.p+'bb'); pg2.addColorStop(.4,pal.p); pg2.addColorStop(1,pal.p2+'cc');
    ctx.fillStyle=pg2; ctx.globalAlpha=.78*prog;
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.bezierCurveTo(-r*.2,-r*.3,-r*.22,-r*.72,0,-r*.96);
    ctx.bezierCurveTo(r*.22,-r*.72,r*.2,-r*.3,0,0);
    ctx.fill();
    ctx.restore();
  }
  // style arm + stigma
  ctx.save(); ctx.translate(x,y);
  ctx.strokeStyle=pal.p2+'aa'; ctx.lineWidth=1.1*sc;
  for(let i=0;i<3;i++){
    const a=(i/3)*Math.PI*2-Math.PI/2;
    const ex=Math.cos(a)*r*.62*prog, ey=Math.sin(a)*r*.62*prog;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(ex,ey); ctx.stroke();
    // stigma head
    ctx.fillStyle='#fff0a0'; ctx.globalAlpha=prog*.9;
    ctx.beginPath(); ctx.ellipse(ex,ey,2.2*sc*prog,1.2*sc*prog,a,0,Math.PI*2); ctx.fill();
  }
  // center glow
  const cg=ctx.createRadialGradient(0,0,0,0,0,r*.3);
  cg.addColorStop(0,'rgba(255,248,160,.35)'); cg.addColorStop(1,'rgba(255,248,160,0)');
  ctx.fillStyle=cg; ctx.globalAlpha=prog;
  ctx.beginPath(); ctx.arc(0,0,r*.3,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // floating light dots
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2+(t*.00115);
    const dist=(r+10*sc)*prog;
    const lx=x+Math.cos(a)*dist, ly=y+Math.sin(a)*dist;
    const la=.38*prog*Math.abs(Math.sin(t*.004+i*1.05));
    ctx.save(); ctx.globalAlpha=la;
    ctx.fillStyle=i%2===0?pal.p2:pal.p;
    ctx.beginPath(); ctx.arc(lx,ly,1.4*sc*prog,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
}

function drawFlower(f,t){
  const FH=cFlowers.height;
  const el=t-f.born-f.delay; if(el<0) return;
  const sg=Math.min(1,el/1300); f.stemH=sg*f.maxH;
  const sw=Math.sin(t*.001*f.swayS+f.sway)*3.8;
  const bx=f.x+sw, by=FH;
  fCtx.save();
  // stem
  const stG=fCtx.createLinearGradient(bx,by,bx+sw*.5,by-f.stemH);
  stG.addColorStop(0,'#050a05'); stG.addColorStop(.4,f.pal.stem); stG.addColorStop(1,f.pal.leaf);
  fCtx.strokeStyle=stG; fCtx.lineWidth=2.5*f.scale; fCtx.lineCap='round';
  fCtx.beginPath(); fCtx.moveTo(bx,by);
  fCtx.quadraticCurveTo(bx+sw*2.8,by-f.stemH*.52,bx+sw,by-f.stemH); fCtx.stroke();
  // leaf pair 1
  if(f.stemH>f.maxH*.2){
    const lp=Math.min(1,(f.stemH-f.maxH*.2)/(f.maxH*.32));
    lilyLeaf(fCtx,bx+sw*.3,by-f.stemH*.32,lp*20*f.scale,1,f.pal.leaf,f.pal.lf2);
    lilyLeaf(fCtx,bx+sw*.3,by-f.stemH*.35,lp*15*f.scale,-1,f.pal.lf2);
  }
  // leaf pair 2
  if(f.stemH>f.maxH*.46){
    const lp2=Math.min(1,(f.stemH-f.maxH*.46)/(f.maxH*.28));
    lilyLeaf(fCtx,bx+sw*.55,by-f.stemH*.55,lp2*15*f.scale,1,f.pal.leaf+'cc',f.pal.lf2+'88');
    lilyLeaf(fCtx,bx+sw*.55,by-f.stemH*.58,lp2*11*f.scale,-1,f.pal.lf2+'aa');
  }
  // side bud
  if(f.hasBud && sg>.52){
    const bp=Math.min(1,(sg-.52)/.3);
    const bsx=bx+sw+f.budSide*f.stemH*.16*bp;
    const bsy=by-f.stemH*.7;
    fCtx.strokeStyle=f.pal.stem+'99'; fCtx.lineWidth=1.3*f.scale;
    fCtx.beginPath(); fCtx.moveTo(bx+sw,by-f.stemH*.65);
    fCtx.quadraticCurveTo(bx+sw+f.budSide*f.stemH*.1,bsy+f.stemH*.06,bsx,bsy); fCtx.stroke();
    lilyBud(fCtx,bsx,bsy,bp,f.pal,f.scale*.7);
  }
  // bloom
  if(sg>.75){
    const bp=Math.min(1,(sg-.75)/.25);
    lilyBloom(fCtx,bx+sw,by-f.stemH,bp,f.pal,f.scale,t);
  }
  fCtx.restore();
}

// ── PARTICLES ──────────────────────────────────────────────────────
const cPart=initCanvas('cParticles'); const pCtx=cPart.getContext('2d');
const PCOLS=[[120,80,220],[60,155,255],[48,200,130],[160,100,255],[80,180,255]];
const particles=Array.from({length:65},()=>{
  const c=PCOLS[Math.floor(Math.random()*PCOLS.length)];
  return { x:Math.random()*W(),y:H()+Math.random()*50, vx:(Math.random()-.5)*.22, vy:-(Math.random()*.28+.08),
    r:Math.random()*1.6+.3, life:Math.random()*300, max:200+Math.floor(Math.random()*250), c };
});
function drawParticles(){
  pCtx.clearRect(0,0,cPart.width,cPart.height);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.life++;
    if(p.life>p.max){ p.life=0; p.x=Math.random()*W(); p.y=H()+10; }
    const prog=p.life/p.max;
    const a=(prog<.12?prog*8.33:prog>.75?(1-prog)*4:1)*.3;
    if(a<=0) return;
    const [r,g,b]=p.c;
    pCtx.beginPath(); pCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    pCtx.fillStyle=`rgba(${r},${g},${b},${a})`; pCtx.fill();
  });
}

// ── MAIN LOOP ──────────────────────────────────────────────────────
function loop(ts){
  drawStars(ts);
  drawAurora(ts);
  fCtx.clearRect(0,0,cFlowers.width,cFlowers.height);
  flowers.forEach(f=>drawFlower(f,ts));
  drawParticles();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ── RESIZE ─────────────────────────────────────────────────────────
function onResize(){
  [cStars,cAurora,cFlowers,cPart].forEach(c=>{ c.width=W(); c.height=H(); });
  flowers=buildFlowers();
}
window.addEventListener('resize',onResize);
</script>
